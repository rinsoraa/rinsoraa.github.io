  <link rel="stylesheet" href="../v3.css">
  <link rel="stylesheet" href="post.css">
  <script>
  /* 主题在首帧之前落定：键名和首页完全一致（rinsora-palette / rinsora-theme / rinsora-hue），
     所以「在首页换了主题再点进文章」两边是同一套配色，不会闪回默认色。 */
  try{
    var root=document.documentElement;
    var PAL={'candy':'candy','sunset':'sunset','lavender':'lavender','lilac':'lavender','mint':'mint'};
    var pal=PAL[localStorage.getItem('rinsora-palette')]||'candy';
    var night=localStorage.getItem('rinsora-theme')==='night';
    root.setAttribute('data-theme',night?'night':pal);
    root.classList.add('pal-'+((pal==='lavender')?'lilac':pal));
    if(night) root.classList.add('night');
    var hue=localStorage.getItem('rinsora-hue');
    if(hue) root.style.setProperty('--hue',hue+'deg');
    /* 从站内跳过来时先把转场遮罩放上场；掀开这件事交给纯 CSS 动画，
       不依赖任何一个脚本 —— 脚本没跑也不会留下一层盖住整页的遮罩。 */
    try{ if(sessionStorage.getItem('rinsora-nav')) root.setAttribute('data-enter','1'); }catch(e){}
  }catch(e){}
  </script>
