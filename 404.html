<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffb6d5">
  <title>页面走丢了 · 空凛 · Rinsora 的小窝</title>
  <meta name="robots" content="noindex">

  <!-- GitHub Pages 会对任意深层路径返回这个 404 页，此时相对路径会以“原请求路径”为基准而失效。
       <base> 把基准固定到站点根，style.css / favicon.ico / index.html 在任意深度都能正确解析。
       若部署成项目站（<用户名>.github.io/<仓库名>/），把下面改成 <base href="/<仓库名>/"> 即可。 -->
  <base href="/">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">

  <style>
    .notfound{position:relative;z-index:30;min-height:100vh;display:grid;place-items:center;padding:28px}
    .notfound-card{width:min(720px,100%);padding:44px 54px 40px;border-radius:42px;text-align:center;position:relative;overflow:hidden}
    .notfound-code{margin:6px 0 2px;font-size:clamp(62px,13vw,112px);font-weight:1000;line-height:.92;letter-spacing:-.05em;
      background:linear-gradient(100deg,#ff9dc6,#ffd36a);-webkit-background-clip:text;background-clip:text;color:transparent}
    .notfound-card h1{font-size:clamp(23px,3.6vw,32px);margin:0 0 14px;letter-spacing:-.03em}
    .notfound-bio{font-size:14px;line-height:1.9;color:var(--muted);margin:0 auto 26px;max-width:470px}
    .notfound-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .notfound-actions .enter-btn{text-decoration:none;margin-top:0}
    .notfound-links{margin:18px 0 0;font-size:11px;color:#aa92a8}
    .notfound-links a{color:#df75a5;font-weight:800;text-decoration:none;margin:0 5px}
    .notfound-links a:hover{text-decoration:underline}
    @media (max-width:760px){
      .notfound-card{padding:32px 18px 28px;border-radius:30px}
      .notfound-card .mascot-wrap{width:150px;height:150px}
      .notfound-card .avatar-large{width:108px;height:108px}
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span><span class="blob blob-b"></span><span class="blob blob-c"></span>
    <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span><span class="spark s4">✧</span>
  </div>
  <div class="screen-grain" aria-hidden="true"></div>

  <main class="notfound">
    <div class="notfound-card glass">
      <div class="mascot-wrap" aria-label="空凛头像">
        <div class="mascot-ring"></div>
        <img class="avatar avatar-large" src="assets/avatar.png" alt="空凛的头像">
      </div>

      <p class="eyebrow">✿ 404 NOT FOUND ✿</p>
      <p class="notfound-code">404</p>
      <h1>咦，这里空空如也</h1>
      <p class="notfound-bio">你要找的页面好像不存在，或者已经被搬到别的地方去了。<br>不如先回到小窝，慢慢逛一逛 ♡</p>

      <div class="notfound-actions">
        <a class="enter-btn" href="index.html">
          <span>回到小窝</span>
          <span class="enter-arrow">→</span>
        </a>
      </div>

      <p class="notfound-links">
        或者直接去
        <a href="index.html#blog">博客</a>·
        <a href="index.html#projects">项目展示</a>
      </p>
      <p class="tip">如果你是从站内链接点过来的，记得跟我说一声呀</p>
    </div>
  </main>
</body>
</html>
